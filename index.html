<head>

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://satalet.github.io/Al-Basem-Delivery/poster.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b1329, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            max-width: 400px;
            width: 100%;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #10b981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.45);
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #f59e0b;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 3px solid #1e293b;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .price-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.2));
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .service-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .coverage-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed rgba(16, 185, 129, 0.4);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 22px;
            font-size: 13px;
            color: #6ee7b7;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #072711;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }

        .btn-call {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .footer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- صورة باسم الشخصية -->
        <div class="avatar-wrapper">
            <img src="basem.jpg" alt="باسم" class="avatar-img">
            <div class="status-badge">⚡</div>
        </div>

        <h1>بسكليتاتو الباسم</h1>
        <p class="subtitle">خدمة توصيل سريعة • لباب بيتك 🏡</p>

        <div class="price-badge">
            أي طلبة بس بـ 5 شيكل 🔥🏷️
        </div>

        <div class="services-grid">
            <div class="service-box">🥩 ملحمة ولحوم</div>
            <div class="service-box">🛒 سوبرماركت</div>
            <div class="service-box">🥖 مخبز ومعجنات</div>
            <div class="service-box">💊 صيدلية وطوارئ</div>
        </div>

        <div class="coverage-box">
            📍 <strong>مناطق التغطية:</strong><br>
            الرام • ضاحية البريد • ضاحية الأقباط
        </div>

        <div class="actions">
            <a href="https://wa.me/972523260604?text=مرحبا%20باسم،%20عندي%20طلبية" class="btn btn-whatsapp">
                <span>💬</span> اطلب فوراً ع الواتساب
            </a>
            <a href="tel:0523260604" class="btn btn-call">
                <span>📞</span> اتصال: 052-326-0604
            </a>
        </div>

        <p class="footer-text">سرعة • أمانة • توصيل فوري</p>
    </div>

</body>
</html>
