<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بسكليتاتو الباسم 🚴‍♂️⚡ | خدمة التوصيل السريع</title>
    <!-- (باقي الميتا والستايل زي ما هي عندك تماماً) -->
    <style>
        /* ... هنا الستايل الخاص فيك ... */
    </style>
</head>
<body>
    <!-- (هنا محتوى الـ Body الخاص فيك كما هو) -->

    <!-- تحديث روابط الأزرار لتدعم التتبع -->
    <div class="actions">
        <a href="https://wa.me/972523260604?text=مرحبا%20باسم%20👋" 
           class="btn btn-whatsapp" 
           onclick="trackClick('wa')">
            💬 اطلب فوراً ع الواتساب
        </a>
        <a href="tel:0523260604" 
           class="btn btn-call" 
           onclick="trackClick('call')">
            📞 اتصال: 0523260604
        </a>
    </div>

    <!-- السكريبت الموحد والكامل -->
    <script>
        const BIN_ID = "6a875d9cda38895dfefcc10c";
        const API_KEY = "$2a$10$p55UIZYJHw6qcxqULfVK0e7EA7ufzRBozx6.yc7PgE2xU/FBqrCEi";

        // 1. تسجيل الزيارة فور تحميل الصفحة
        window.addEventListener('load', () => {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
                headers: { 'X-Master-Key': API_KEY } 
            })
            .then(r => r.json())
            .then(data => {
                let rec = data.record || {};
                rec.views = (rec.views || 0) + 1;
                return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(rec)
                });
            }).catch(e => console.log("Tracking error"));
        });

        // 2. تسجيل النقرات
        function trackClick(type) {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
                headers: { 'X-Master-Key': API_KEY } 
            })
            .then(r => r.json())
            .then(data => {
                let rec = data.record || {};
                if (type === 'wa') rec.whatsapp_clicks = (rec.whatsapp_clicks || 0) + 1;
                if (type === 'call') rec.call_clicks = (rec.call_clicks || 0) + 1;
                return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(rec)
                });
            }).catch(e => console.log("Click track error"));
        }

        // ... (باقي السكريبتات الخاصة بك مثل الـ Service Worker والـ Install) ...
    </script>
</body>
</html>
