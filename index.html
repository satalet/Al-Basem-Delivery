<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بسكليتاتو الباسم | خدمة التوصيل السريع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-badge {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .price-tag {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .locations {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed rgba(16, 185, 129, 0.4);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #6ee7b7;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #0b2912;
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        .btn-call {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .btn-call:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-badge">⚡🚲</div>
        
        <h1>بسكليتاتو الباسم</h1>
        <p class="subtitle">خدمة توصيل الطلبات والأغراض السريعة</p>

        <div class="price-tag">
            أي طلبة بس بـ 7 شيكل 🏷️
        </div>

        <div class="features-grid">
            <div class="feature-item">🥩 لحوم وملاحم</div>
            <div class="feature-item">🛒 سوبرماركت</div>
            <div class="feature-item">🥖 مخابز ومعجنات</div>
            <div class="feature-item">💊 صيدلية وطوارئ</div>
        </div>

        <div class="locations">
            📍 <strong>مناطق التوصيل:</strong><br>
            الرام • ضاحية البريد • ضاحية الأقباط
        </div>

        <div class="actions">
            <a href="https://wa.me/972523260604?text=مرحبا%20باسم،%20عندي%20طلبية" class="btn btn-whatsapp">
                <span>💬</span> اطلب عبر الواتساب فوراً
            </a>
            <a href="tel:0523260604" class="btn btn-call">
                <span>📞</span> اتصال مباشر (052-326-0604)
            </a>
        </div>

        <p class="footer-note">أمانة • سرعة • لباب الدار</p>
    </div>

</body>
</html>
