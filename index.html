<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بسكليتاتو الباسم | خدمة التوصيل السريع</title>

    <!-- وسوم المعاينة للفيسبوك والواتساب (Open Graph & Social Share) -->
    <meta property="og:title" content="بسكليتاتو الباسم | خدمة التوصيل السريع">
    <meta property="og:description" content="أي طلبة بـ 7 شيكل بس! الرام • ضاحية البريد • ضاحية الأقباط. أمانة وسرعة لباب الدار.">
    <meta property="og:image" content="poster.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="poster.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* عرض البوستر داخل الكرت */
        .poster-container {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            margin-bottom: 18px;
            background: #000;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn-whatsapp {
            background: #25d366;
            color: #0b2912;
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        .btn-call {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        .btn-call:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- قسم صورة البوستر -->
        <div class="poster-container">
            <img src="poster.jpg" alt="بوستر بسكليتاتو الباسم" class="poster-img">
        </div>

        <!-- أزرار التواصل السريع -->
        <div class="actions">
            <a href="https://wa.me/972523260604?text=مرحبا%20باسم،%20عندي%20طلبية" class="btn btn-whatsapp">
                <span>💬</span> اطلب عبر الواتساب فوراً
            </a>
            <a href="tel:0523260604" class="btn btn-call">
                <span>📞</span> اتصال مباشر (052-326-0604)
            </a>
        </div>

        <p class="footer-note">⚡ خدمة سريعة • أمانة • لباب بيتك 🏡</p>
    </div>

</body>
</html>
