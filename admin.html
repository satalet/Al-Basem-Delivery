<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإحصائيات | بسكليتاتو الباسم</title>
    <style>
        /* (نفس تنسيقاتك القديمة مع إضافة تنسيق الإحصائيات) */
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: system-ui, sans-serif; }
        .admin-card { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 28px 20px; width: 100%; max-width: 400px; backdrop-filter: blur(15px); }
        h2 { color: #6ee7b7; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: rgba(15,23,42,0.6); padding: 10px; border-radius: 12px; font-size: 12px; }
        .stat-val { display: block; font-size: 18px; font-weight: bold; color: #3b82f6; }
        .current-status { padding: 12px; border-radius: 14px; margin-bottom: 20px; font-weight: bold; }
        .status-on { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid #10b981; }
        .status-off { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .btn-status { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-online { background: #10b981; }
        .btn-offline { background: #ef4444; }
    </style>
</head>
<body>
    <div class="admin-card">
        <div id="lockScreen">
            <input type="password" id="pinInput" placeholder="الرمز السري" class="pin-input" style="width:100%; padding:10px; border-radius:8px;">
            <button onclick="checkPin()" style="width:100%; padding:10px; margin-top:10px; cursor:pointer;">دخول</button>
        </div>
        <div id="dashboardScreen" style="display:none;">
            <h2>📊 إحصائيات بسكليتاتو</h2>
            <div class="stats-grid">
                <div class="stat-box">الزيارات<span id="views" class="stat-val">0</span></div>
                <div class="stat-box">واتساب<span id="wa" class="stat-val">0</span></div>
                <div class="stat-box">اتصال<span id="call" class="stat-val">0</span></div>
            </div>
            <div id="statusBox" class="current-status">جارِ الفحص...</div>
            <button class="btn-status btn-online" onclick="updateData(true)">🟢 متاح</button>
            <button class="btn-status btn-offline" onclick="updateData(false)">🔴 غير متاح</button>
        </div>
    </div>

    <script>
        const BIN_ID = "6a875d9cda38895dfefcc10c";
        const API_KEY = "$2a$10$p55UIZYJHw6qcxqULfVK0e7EA7ufzRBozx6.yc7PgE2xU/FBqrCEi";

        async function loadData() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': API_KEY} });
            const data = (await res.json()).record;
            document.getElementById('views').textContent = data.views || 0;
            document.getElementById('wa').textContent = data.whatsapp_clicks || 0;
            document.getElementById('call').textContent = data.call_clicks || 0;
            const statusBox = document.getElementById('statusBox');
            statusBox.textContent = data.active ? "الحالة: متاح 🟢" : "الحالة: غير متاح 🔴";
            statusBox.className = "current-status " + (data.active ? "status-on" : "status-off");
        }

        async function updateData(isActive) {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': API_KEY} });
            let current = (await res.json()).record;
            current.active = isActive;
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json', 'X-Master-Key': API_KEY},
                body: JSON.stringify(current)
            });
            loadData();
        }

        function checkPin() {
            if(document.getElementById('pinInput').value === "201412") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadData();
            }
        }
    </script>
</body>
</html>
